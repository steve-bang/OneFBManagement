<!-- @dsCard group="Admin" height=300 subtitle="Thẻ chỉ số và biểu đồ cột cho web admin" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.k{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:8px}
.l{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
.v{font-size:30px;line-height:38px;font-weight:700;font-variant-numeric:tabular-nums}
.d{align-self:flex-start;border-radius:var(--radius-full);padding:2px 10px;font-size:13px;line-height:18px;font-weight:500}
.up{background:var(--bg-success-subtle);color:var(--text-success-subtle)}
.dn{background:var(--bg-danger-subtle);color:var(--text-danger-subtle)}
.bars{display:flex;align-items:flex-end;gap:6px;height:56px}
.bars i{flex:1;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--chart-1)}
.bars i.b{background:var(--chart-2)}
.legend{display:flex;gap:16px;margin-top:16px;font-size:14px;line-height:20px;color:var(--text-secondary)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--chart-1)}
.legend span+span::before{background:var(--chart-2)}
</style></head><body>
<div class="row">
<div class="k"><span class="l">Doanh thu hôm nay</span><span class="v">12.450.000 ₫</span><span class="d up">▲ 8,2% so với hôm qua</span></div>
<div class="k"><span class="l">Số hoá đơn</span><span class="v">186</span><span class="d dn">▼ 3,1% so với hôm qua</span></div>
<div class="k"><span class="l">Doanh thu theo giờ</span><div class="bars"><i style="height:20%"></i><i style="height:35%"></i><i style="height:60%"></i><i style="height:90%"></i><i class="b" style="height:70%"></i><i class="b" style="height:45%"></i><i class="b" style="height:55%"></i></div></div>
</div>
<div class="legend"><span>Ca sáng</span><span>Ca tối</span></div>
</body></html>
