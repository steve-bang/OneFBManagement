<!-- @dsCard group="Kitchen" height=380 subtitle="Phiếu bếp với đồng hồ chờ" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.tk{width:260px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.tb{font-size:28px;line-height:36px;font-weight:700}
.tm{font-size:32px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.it{padding:12px 16px;font-size:20px;line-height:28px;font-weight:500;border-top:1px solid var(--border-subtle)}
.it small{display:block;font-size:16px;line-height:22px;color:var(--text-secondary);font-weight:400}
.ok{background:var(--bg-sla-ok);color:var(--text-sla-ok)}
.warn{background:var(--bg-sla-warn);color:var(--text-sla-warn)}
.late{background:var(--bg-sla-late);color:var(--text-sla-late)}
.done{margin:12px 16px 16px;height:var(--target-kds);width:calc(100% - 32px);border:0;border-radius:var(--radius-md);font:inherit;font-size:20px;font-weight:700;background:var(--bg-action);color:var(--text-on-action)}
</style></head><body>
<div class="row">
<div class="tk"><div class="hd ok"><span class="tb">BÀN 12</span><span class="tm">02:10</span></div><div class="it">2× Phở bò tái nạm<small>Không hành</small></div><div class="it">1× Gỏi cuốn</div><button class="done">Xong món</button></div>
<div class="tk"><div class="hd warn"><span class="tb">BÀN 07</span><span class="tm">08:45</span></div><div class="it">1× Cơm tấm sườn bì<small>Thêm trứng</small></div><button class="done">Xong món</button></div>
<div class="tk"><div class="hd late"><span class="tb">BÀN 03</span><span class="tm">15:02</span></div><div class="it">3× Cà phê sữa đá</div><div class="it">1× Bạc xỉu nóng</div><button class="done">Xong món</button></div>
</div>
</body></html>
