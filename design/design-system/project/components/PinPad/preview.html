<!-- @dsCard group="Auth" height=420 subtitle="Bàn phím PIN 4–6 số" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
body{margin:0;padding:24px;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);display:flex;justify-content:center}
.box{width:max-content;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-overlay);text-align:center}
h2{margin:0 0 4px;font-size:18px;line-height:26px;font-weight:600}
p{margin:0 0 16px;font-size:13px;line-height:18px;color:var(--text-secondary)}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.dots i{width:16px;height:16px;border-radius:var(--radius-full);box-shadow:inset 0 0 0 2px var(--border-control)}
.dots i.on{background:var(--text-primary);box-shadow:none}
.keys{display:grid;grid-template-columns:repeat(3,var(--pin-key));gap:8px}
.keys button{height:var(--pin-key);border:0;border-radius:var(--radius-md);background:var(--bg-sunken);color:var(--text-primary);font:inherit;font-size:28px;font-weight:600}
.keys button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.keys .go{background:var(--bg-action);color:var(--text-on-action);font-size:16px}
.keys .sm{font-size:16px;color:var(--text-secondary)}
</style></head><body>
<div class="box">
<h2>Quản lý duyệt giảm giá</h2><p>Nhập PIN của người có quyền duyệt</p>
<div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
<div class="keys">
<button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button>
<button class="sm">Xoá</button><button>0</button><button class="go">Duyệt</button>
</div></div>
</body></html>
